<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>策划项目图库 · 王愉嘉作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root{--ink:#342c31;--paper:#fffaf0;--line:#4d3540;--pink:#ef78a9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f8e8dc;font-family:'Noto Sans SC',sans-serif}.gallery-header{display:flex;align-items:center;justify-content:space-between;padding:17px max(5vw,24px);border-bottom:2px solid var(--line);background:var(--paper);position:sticky;top:0}.gallery-header a{color:var(--ink);font:13px 'DM Mono',monospace;text-decoration:none}.gallery-header a:hover{text-decoration:underline}.gallery-header strong{font-size:15px}.gallery{max-width:1220px;margin:0 auto;padding:52px 24px 85px}.gallery p{margin:0;font:12px 'DM Mono',monospace;color:#8a626f;letter-spacing:.8px}.gallery h1{font-size:clamp(32px,5vw,54px);margin:6px 0 28px}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.gallery-grid figure{margin:0;background:var(--paper);padding:10px;border:1.5px solid var(--line);box-shadow:5px 5px 0 var(--line)}.gallery-grid img{display:block;width:100%;height:auto}.gallery-grid figcaption{padding:9px 2px 1px;font:12px 'DM Mono',monospace}@media(max-width:650px){.gallery{padding-top:34px}.gallery-grid{grid-template-columns:1fr}}
      .gallery-trigger{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}.gallery-trigger img{transition:transform .2s}.gallery-trigger:hover img{transform:scale(1.01)}.lightbox{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:26px;background:rgba(25,18,22,.88);cursor:zoom-out}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:88vh;object-fit:contain;border:2px solid var(--paper);box-shadow:7px 7px 0 rgba(0,0,0,.35);cursor:default}.lightbox button{position:absolute;top:18px;right:22px;border:1px solid var(--paper);background:var(--ink);color:white;width:38px;height:38px;border-radius:50%;font-size:23px;cursor:pointer}
    </style>
  </head>
  <body>
    <header class="gallery-header"><a href="index.html#planning">← 返回策划页</a><strong>王愉嘉作品集</strong></header>
    <main class="gallery"><p>PROJECT GALLERY</p><h1 id="project-title">策划项目</h1><div class="gallery-grid" id="gallery-grid"></div></main>
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片放大预览"><button type="button" aria-label="关闭图片预览">×</button><img alt="放大预览" /></div>
    <script>
      const projects={market:{title:'汉服社国风市集活动',images:['王愉嘉-策划作品集/汉服社国风市集活动.png','王愉嘉-策划作品集/汉服社国风市集活动2.png']},ceremony:{title:'汉服社及笄礼',images:['王愉嘉-策划作品集/汉服社及笄礼.png','王愉嘉-策划作品集/汉服社及笄礼2.png']}};
      const project=projects[new URLSearchParams(location.search).get('project')]||projects.market;
      document.title=`${project.title} · 王愉嘉作品集`;document.getElementById('project-title').textContent=project.title;
      const grid=document.getElementById('gallery-grid');const lightbox=document.getElementById('lightbox');const lightboxImage=lightbox.querySelector('img');
      grid.innerHTML=project.images.map((image,index)=>`<figure><button class="gallery-trigger" type="button" data-image="${image}" data-label="${project.title} 图片 ${index+1}"><img src="${image}" alt="${project.title} 图片 ${index+1}"></button><figcaption>点击图片放大 · ${String(index+1).padStart(2,'0')}</figcaption></figure>`).join('');
      grid.addEventListener('click',event=>{const button=event.target.closest('.gallery-trigger');if(!button)return;lightboxImage.src=button.dataset.image;lightboxImage.alt=button.dataset.label;lightbox.classList.add('open');});
      const close=()=>lightbox.classList.remove('open');lightbox.addEventListener('click',event=>{if(event.target===lightbox||event.target.tagName==='BUTTON')close();});document.addEventListener('keydown',event=>{if(event.key==='Escape')close();});
    </script>
  </body>
</html>
