<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>策划项目图库 · 王愉嘉作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      :root{--deep:#241820;--wine:#602d3d;--red:#9b4653;--cream:#f6ead2;--paper:#fff8e9;--gold:#d9ad55;--sage:#aebbae;--ink:#33252b;--line:#553744}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 82% 12%,#f7e8c8 0 12%,transparent 34%),linear-gradient(135deg,#c4cbbf,#e6d1bd 56%,#d6b4ad);font-family:'Noto Sans SC',sans-serif}body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(90deg,transparent 0 46px,#5b3b4618 47px 48px)}.gallery-header{position:sticky;z-index:3;top:0;display:flex;align-items:center;justify-content:space-between;padding:17px max(5vw,24px);border-bottom:2px solid var(--gold);background:rgba(36,24,32,.96);color:var(--cream);box-shadow:0 5px 0 #24182033}.gallery-header a{color:#f1d28d;font:13px 'DM Mono',monospace;text-decoration:none;transition:color .2s,transform .2s}.gallery-header a:hover{color:#fff8e9;transform:translateX(-3px)}.gallery-header strong{font:700 15px 'Noto Serif SC',serif;letter-spacing:.12em}.gallery{position:relative;max-width:1220px;margin:0 auto;padding:58px 24px 90px}.gallery>p{margin:0;color:var(--wine);font:500 12px 'DM Mono',monospace;letter-spacing:.18em}.gallery h1{max-width:850px;margin:7px 0 32px;color:var(--deep);font:900 clamp(34px,5vw,58px)/1.35 'Noto Serif SC',serif;letter-spacing:.06em;text-wrap:balance}.gallery h1::after{content:'  /  TICKET ARCHIVE';color:var(--red);font:500 10px 'DM Mono',monospace;letter-spacing:.14em}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.gallery-grid figure{position:relative;margin:0;padding:12px 12px 9px;background:var(--paper);border:2px solid var(--line);border-radius:4px;box-shadow:8px 9px 0 #603d49;transform:rotate(-.45deg)}.gallery-grid figure:nth-child(even){transform:rotate(.45deg)}.gallery-grid figure::before{content:'';position:absolute;inset:5px;border:1px solid #d9ad5575;pointer-events:none}.gallery-grid img{display:block;width:100%;height:auto}.gallery-grid figcaption{position:relative;padding:12px 3px 2px;color:var(--wine);font:500 11px 'DM Mono',monospace;letter-spacing:.05em}.gallery-trigger{position:relative;padding:0;border:0;background:#ead9bd;cursor:zoom-in;display:block;width:100%;overflow:hidden}.gallery-trigger img{transition:transform .3s,filter .3s}.gallery-trigger:hover img{transform:scale(1.018);filter:saturate(1.06)}.lightbox{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:26px;background:rgba(36,24,32,.94);cursor:zoom-out}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:88vh;object-fit:contain;border:3px solid var(--gold);box-shadow:9px 10px 0 rgba(0,0,0,.36);cursor:default}.lightbox button{position:absolute;top:18px;right:22px;border:2px solid var(--gold);background:var(--wine);color:var(--cream);width:42px;height:42px;border-radius:50%;font-size:23px;cursor:pointer}@media(max-width:650px){.gallery-header strong{font-size:12px}.gallery{padding-top:38px}.gallery-grid{grid-template-columns:1fr;gap:24px}.gallery-grid figure,.gallery-grid figure:nth-child(even){transform:none}.gallery h1::after{display:block;margin-top:8px}}
    </style>
  </head>
  <body>
    <header class="gallery-header"><a href="index.html#planning">← 返回策划售票处</a><strong>愉嘉映画 · 策划放映室</strong></header>
    <main class="gallery"><p>PLANNING ARCHIVE / 策划放映室</p><h1 id="project-title">策划项目</h1><div class="gallery-grid" id="gallery-grid"></div></main>
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片放大预览"><button type="button" aria-label="关闭图片预览">×</button><img alt="放大预览" /></div>
    <script>
      const projects={market:{title:'汉服社国风市集活动',images:['web-assets/planning/market-1.jpg','web-assets/planning/market-2.jpg']},ceremony:{title:'汉服社及笄礼',images:['web-assets/planning/ceremony-1.jpg','web-assets/planning/ceremony-2.jpg']}};
      const project=projects[new URLSearchParams(location.search).get('project')]||projects.market;
      document.title=`${project.title} · 王愉嘉作品集`;document.getElementById('project-title').textContent=project.title;
      const grid=document.getElementById('gallery-grid');const lightbox=document.getElementById('lightbox');const lightboxImage=lightbox.querySelector('img');
      grid.innerHTML=project.images.map((image,index)=>`<figure><button class="gallery-trigger" type="button" data-image="${image}" data-label="${project.title} 图片 ${index+1}"><img src="${image}" alt="${project.title} 图片 ${index+1}"></button><figcaption>点击图片放大 · ${String(index+1).padStart(2,'0')}</figcaption></figure>`).join('');
      grid.addEventListener('click',event=>{const button=event.target.closest('.gallery-trigger');if(!button)return;lightboxImage.src=button.dataset.image;lightboxImage.alt=button.dataset.label;lightbox.classList.add('open');});
      const close=()=>lightbox.classList.remove('open');lightbox.addEventListener('click',event=>{if(event.target===lightbox||event.target.tagName==='BUTTON')close();});document.addEventListener('keydown',event=>{if(event.key==='Escape')close();});
    </script>
  </body>
</html>
