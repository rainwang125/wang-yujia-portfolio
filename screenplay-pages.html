<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剧本阅读 · 王愉嘉作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root{--ink:#342c31;--paper:#fffaf0;--line:#4d3540;--pink:#ef78a9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f0dedd;font-family:'Noto Sans SC',sans-serif}.reader-header{display:flex;align-items:center;justify-content:space-between;padding:17px max(5vw,24px);border-bottom:2px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:2}.reader-header a{color:var(--ink);font:13px 'DM Mono',monospace;text-decoration:none}.reader-header a:hover{text-decoration:underline}.reader-header strong{font-size:15px}.reader{max-width:1080px;margin:0 auto;padding:42px 24px 88px}.reader-meta{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:18px}.reader-meta p{margin:0;font:12px 'DM Mono',monospace;color:#8a626f;letter-spacing:.8px}.reader h1{font-size:clamp(30px,5vw,52px);margin:5px 0 0}.pdf-reader{width:100%;height:min(82vh,1080px);min-height:620px;border:1.5px solid var(--line);box-shadow:6px 6px 0 var(--line);background:#fff}.pdf-reader object{display:block;width:100%;height:100%}.pdf-fallback{padding:30px;text-align:center}.pdf-fallback a{color:var(--ink);font-weight:700}.not-found{padding:28px;background:var(--paper);border:1.5px solid var(--line);display:none}@media(max-width:650px){.reader{padding:30px 14px 64px}.reader-meta{display:block}.reader-meta p{margin-bottom:6px}.pdf-reader{height:72vh;min-height:520px;box-shadow:3px 3px 0 var(--line)}}
    </style>
  </head>
  <body>
    <header class="reader-header"><a href="index.html#screenplays">← 返回剧本页</a><strong>王愉嘉作品集</strong></header>
    <main class="reader"><div class="reader-meta"><div><p>SCRIPT PDF READER</p><h1 id="title">剧本阅读</h1></div><p id="count"></p></div><div class="pdf-reader" id="pdf-reader"></div><div class="not-found" id="not-found">未找到对应剧本。</div></main>
    <script>
      const scripts={cage:{title:'《囚笼》',file:'cage.pdf',pages:17},twins:{title:'《双生》',file:'twins.pdf',pages:7},self:{title:'《我与我》',file:'self.pdf',pages:8},heartbeat:{title:'《最后的心跳》',file:'heartbeat.pdf',pages:10},speculum:{title:'Speculum',file:'speculum.pdf',pages:4}};
      const script=scripts[new URLSearchParams(location.search).get('script')];const reader=document.getElementById('pdf-reader');
      if(script){document.title=`${script.title} · 王愉嘉作品集`;document.getElementById('title').textContent=script.title;document.getElementById('count').textContent=`共 ${script.pages} 页 · PDF 阅读`;const src=`script-pdfs/${script.file}`;reader.innerHTML=`<object data="${src}" type="application/pdf" aria-label="${script.title} PDF 阅读器"><div class="pdf-fallback"><p>你的浏览器暂不支持内嵌 PDF 阅读。</p><a href="${src}" target="_blank" rel="noopener">在新标签页打开完整剧本 PDF →</a></div></object>`;}
      else{reader.style.display='none';document.getElementById('not-found').style.display='block';}
    </script>
  </body>
</html>
