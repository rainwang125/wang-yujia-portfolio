<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剧本阅读 · 王愉嘉作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root{--ink:#342c31;--paper:#fffaf0;--line:#4d3540;--pink:#ef78a9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f0dedd;font-family:'Noto Sans SC',sans-serif}.reader-header{display:flex;align-items:center;justify-content:space-between;padding:17px max(5vw,24px);border-bottom:2px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:2}.reader-header a{color:var(--ink);font:13px 'DM Mono',monospace;text-decoration:none}.reader-header a:hover{text-decoration:underline}.reader-header strong{font-size:15px}.reader{max-width:1080px;margin:0 auto;padding:42px 24px 88px}.reader-meta{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:18px}.reader-meta p{margin:0;font:12px 'DM Mono',monospace;color:#8a626f;letter-spacing:.8px}.reader h1{font-size:clamp(30px,5vw,52px);margin:5px 0 0}.pdf-pages{display:grid;gap:30px}.pdf-page{margin:0;display:grid;gap:9px;justify-items:center;min-height:130px;align-content:center}.pdf-page canvas{display:block;width:100%;height:auto;max-width:920px;border:1.5px solid var(--line);box-shadow:6px 6px 0 var(--line);background:#fff}.pdf-page figcaption{font:12px 'DM Mono',monospace;color:#80656d}.loading{padding:28px;text-align:center;background:var(--paper);border:1.5px solid var(--line);font:13px 'DM Mono',monospace;color:#80656d}.not-found{padding:28px;background:var(--paper);border:1.5px solid var(--line);display:none}@media(max-width:650px){.reader{padding:30px 14px 64px}.reader-meta{display:block}.reader-meta p{margin-bottom:6px}.pdf-pages{gap:20px}.pdf-page canvas{box-shadow:3px 3px 0 var(--line)}}
    </style>
  </head>
  <body>
    <header class="reader-header"><a href="index.html#screenplays">← 返回剧本页</a><strong>王愉嘉作品集</strong></header>
    <main class="reader"><div class="reader-meta"><div><p>SCRIPT PDF READER</p><h1 id="title">剧本阅读</h1></div><p id="count"></p></div><div class="pdf-pages" id="pdf-pages"></div><div class="not-found" id="not-found">未找到对应剧本。</div></main>
    <script type="module">
      import * as pdfjsLib from './pdfjs/pdf.min.mjs';
      pdfjsLib.GlobalWorkerOptions.workerSrc='./pdfjs/pdf.worker.min.mjs';
      const scripts={cage:{title:'《囚笼》',file:'cage.pdf',pages:17},twins:{title:'《双生》',file:'twins.pdf',pages:7},self:{title:'《我与我》',file:'self.pdf',pages:8},heartbeat:{title:'《最后的心跳》',file:'heartbeat.pdf',pages:10},speculum:{title:'Speculum',file:'speculum.pdf',pages:4}};
      const script=scripts[new URLSearchParams(location.search).get('script')];const pages=document.getElementById('pdf-pages');
      if(script){
        document.title=`${script.title} · 王愉嘉作品集`;document.getElementById('title').textContent=script.title;document.getElementById('count').textContent=`共 ${script.pages} 页 · 阅读模式`;
        pages.innerHTML='<div class="loading">正在准备剧本…</div>';
        try{
          const pdf=await pdfjsLib.getDocument(`script-pdfs/${script.file}`).promise;
          pages.innerHTML=Array.from({length:pdf.numPages},(_,index)=>`<figure class="pdf-page" data-page="${index+1}"><figcaption>PAGE ${String(index+1).padStart(2,'0')}</figcaption></figure>`).join('');
          const renderPage=async figure=>{if(figure.dataset.ready)return;figure.dataset.ready='true';const page=await pdf.getPage(Number(figure.dataset.page));const targetWidth=Math.min(920,Math.max(280,figure.clientWidth||760));const base=page.getViewport({scale:1});const viewport=page.getViewport({scale:targetWidth/base.width*2});const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;canvas.setAttribute('aria-label',`${script.title} 第 ${figure.dataset.page} 页`);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;figure.prepend(canvas);};
          const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){renderPage(entry.target);observer.unobserve(entry.target);}}),{rootMargin:'800px 0px'});document.querySelectorAll('.pdf-page').forEach(page=>observer.observe(page));
        }catch(error){pages.innerHTML='<div class="not-found" style="display:block">剧本暂时无法加载，请稍后重试。</div>';}
      }else{pages.style.display='none';document.getElementById('not-found').style.display='block';}
    </script>
  </body>
</html>
